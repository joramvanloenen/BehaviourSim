name: BehaviourSim tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run learning engine tests
        run: npm test
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: |
            behavioursim-desktop.png
            behavioursim-mobile.png
          if-no-files-found: ignore
